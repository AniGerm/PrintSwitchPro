name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag matches Directory.Build.props version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROP=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag v${TAG} stimmt nicht mit Version ${PROP} in Directory.Build.props überein."
            exit 1
          fi
          echo "Version OK: ${PROP}"
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"${TAG}\"/" installer/PrintSwitchPro.iss

      - name: Test core
        run: dotnet test tests/PrintSwitchPro.Core.Tests/PrintSwitchPro.Core.Tests.csproj -c Release

      # Multi-file self-contained: avoids .NET single-file extraction into %TEMP%
      # (also friendlier under Smart App Control once installed).
      - name: Publish Windows app
        run: >
          dotnet publish src/PrintSwitchPro/PrintSwitchPro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o artifacts/publish

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/PrintSwitchPro-Portable-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\PrintSwitchPro.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/PrintSwitchPro-Setup-*.exe
            artifacts/PrintSwitchPro-Portable-*-win-x64.zip
          if-no-files-found: error

  publish-release:
    needs: [release-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ### Windows (x64)

            **Empfohlen bei Smart App Control / Fehler 4551:** portable ZIP nutzen (kein Inno-Temp):
            - `PrintSwitchPro-Portable-*-win-x64.zip` → entpacken → `PrintSwitchPro.exe` starten
            - Vorher ggf. `Unblock-File` auf die ZIP und die EXE

            Optional: `PrintSwitchPro-Setup-*.exe` (Inno). Ohne Codesigning kann **Smart App Control** das Setup mit **Fehler 4551** blockieren (temporäre `*.tmp`).

            #### Fehler 4551 umgehen
            1. Portable ZIP verwenden, **oder**
            2. Windows-Sicherheit → App- & Browsersteuerung → **Smart App Control** → Aus (Neustart), Setup starten, danach wieder an wenn gewünscht
            3. PowerShell: `Unblock-File .\PrintSwitchPro-Setup-*.exe`

            Dauerhaft: Authenticode-Zertifikat + SignTool im Release.
          files: |
            dist-release/PrintSwitchPro-Setup-*.exe
            dist-release/PrintSwitchPro-Portable-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
